[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-planner"
version = "1.0.0"
description = "Local cartridge compiler for Hive Code Planner"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
pdf = ["pymupdf>=1.24"]
docx = ["python-docx>=1.1"]
html = ["beautifulsoup4>=4.12"]
pptx = ["python-pptx>=1.0"]
formats = ["pymupdf>=1.24", "python-docx>=1.1", "beautifulsoup4>=4.12", "python-pptx>=1.0"]
embeddings = ["sentence-transformers>=3.0"]

[project.scripts]
hive-planner = "hive_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hive_planner = ["bootstrap_templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
